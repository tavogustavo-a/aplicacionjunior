<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sin conexión</title>
  {% include "_icons.html" %}
  <style>
    :root {
      --err-bg1: #1e293b;
      --err-bg2: #0f172a;
      --err-card: rgba(255, 255, 255, 0.96);
      --err-text: #0f172a;
      --err-muted: #475569;
      --err-accent: #d97706;
      --err-btn: #1e293b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background:
        radial-gradient(1200px 600px at 10% 0%, rgba(217, 119, 6, 0.22), transparent 55%),
        linear-gradient(160deg, var(--err-bg1), var(--err-bg2));
      color: var(--err-text);
    }
    .err-card {
      width: 100%;
      max-width: 420px;
      background: var(--err-card);
      border-radius: 16px;
      padding: 1.75rem 1.5rem 1.5rem;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }
    .err-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(217, 119, 6, 0.14);
      color: var(--err-accent);
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1;
    }
    h1 {
      margin: 0 0 0.55rem;
      font-size: 1.35rem;
      line-height: 1.25;
    }
    p {
      margin: 0 0 0.75rem;
      color: var(--err-muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }
    .err-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
      margin-top: 1.15rem;
    }
    .err-btn {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 0.7rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      background: var(--err-btn);
    }
    .err-btn--soft {
      background: #e2e8f0;
      color: #0f172a;
    }
    .err-btn:hover { filter: brightness(1.06); }
    .err-retry-form {
      display: inline;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <main class="err-card" role="main">
    <div class="err-icon" aria-hidden="true">⌀</div>
    <h1>Sin conexión</h1>
    <p>No hay internet o el servidor no responde ahora.</p>
    <p>Cuando vuelva la conexión, pulsa reintentar. No hace falta copiar ni abrir ningún enlace.</p>
    <div class="err-actions">
      <form method="get" action="" class="err-retry-form">
        <input type="hidden" name="_retry" value="1">
        <button type="submit" class="err-btn" id="errRetryBtn">Reintentar</button>
      </form>
      <a class="err-btn err-btn--soft" href="{{ home_url }}">Ir al inicio</a>
    </div>
  </main>
  <script src="{{ url_for('static', filename='error_page.js') }}" defer></script>
</body>
</html>
